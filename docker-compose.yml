services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - asistencia_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  database-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - asistencia_postgres_backups:/backups
    command: >-
      sh -c "set -u; mkdir -p /backups/daily /backups/weekly /backups/monthly;
      while true; do
      stamp=$$(date +%Y%m%d-%H%M%S); day=$$(date +%u); dom=$$(date +%d);
      tmp=/backups/daily/.biotime-$${stamp}.dump.tmp;
      if pg_dump --format=custom --file=$$tmp; then
        mv $$tmp /backups/daily/biotime-$${stamp}.dump;
        cp /backups/daily/biotime-$${stamp}.dump /backups/weekly/biotime-week-$${stamp}.dump;
        if [ \"$$dom\" = \"01\" ]; then cp /backups/daily/biotime-$${stamp}.dump /backups/monthly/biotime-month-$${stamp}.dump; fi;
        echo \"$$(date -Iseconds) OK biotime-$${stamp}.dump\" >> /backups/backup.log;
        find /backups/daily -type f -name '*.dump' -mtime +14 -delete;
        if [ \"$$day\" = \"7\" ]; then find /backups/weekly -type f -name '*.dump' -mtime +90 -delete; fi;
        if [ \"$$dom\" = \"01\" ]; then find /backups/monthly -type f -name '*.dump' -mtime +365 -delete; fi;
      else
        rm -f $$tmp;
        echo \"$$(date -Iseconds) ERROR pg_dump\" >> /backups/backup.log;
      fi;
      sleep 86400; done"

  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      DB_HOST: database
      DB_PORT: 5432
      TZ: America/Mazatlan

    ports:
      - "${PORT}:3000"

    depends_on:
      database:
        condition: service_healthy

    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_logs:/app/logs

    # En Docker se usa el proceso estable; nodemon reinicia al detectar los
    # propios archivos de log y puede interrumpir las consultas ADMS.
    command: npm start

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
            "http://127.0.0.1:3000/api/health/ready"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  integration:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      DB_HOST: database
      DB_PORT: 5432
      INTEGRATION_HOST: 0.0.0.0
      INTEGRATION_PORT: 3001
      TZ: America/Mazatlan

    ports:
      - "3001:3001"

    depends_on:
      database:
        condition: service_healthy

    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_logs:/app/logs

    command: node src/scripts/start-integration-container.js

volumes:
  asistencia_postgres_data:
  asistencia_postgres_backups:
  api_node_modules:
  api_logs:
